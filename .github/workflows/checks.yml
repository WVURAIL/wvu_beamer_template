name: Build template

on:
  push:
    branches: [main]
    paths:
      - '**/*.tex'
      - '**/*.sty'
      - 'styles/**'
      - 'latexmkrc'
      - '.github/workflows/checks.yml'
  pull_request:
    paths:
      - '**/*.tex'
      - '**/*.sty'
      - 'styles/**'
      - 'latexmkrc'
      - '.github/workflows/checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Compile the starter and guide with LuaLaTeX
        uses: xu-cheng/latex-action@v4.1.0
        with:
          root_file: |
            main.tex
            guide.tex
          latexmk_use_lualatex: true
          latexmk_shell_escape: true
          extra_system_packages: inkscape
          texlive_version: 2025
      - name: Save the compiled starter
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wvu-beamer-example
          path: main.pdf
          if-no-files-found: error
          retention-days: 14
      - name: Save the compiled guide
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wvu-beamer-guide
          path: guide.pdf
          if-no-files-found: error
          retention-days: 14
